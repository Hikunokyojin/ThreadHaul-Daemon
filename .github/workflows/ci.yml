name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: Build and test (CMake, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  build-script:
    name: Build and test (build.cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        shell: cmd
        run: build.cmd test

  analyze:
    name: Static analysis (MSVC /analyze)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # THREADHAUL_ANALYZE adds /analyze /WX: any finding fails the build.
      - name: Configure with /analyze
        run: cmake --preset windows-msvc -DTHREADHAUL_ANALYZE=ON

      - name: Build
        run: cmake --build --preset release

  fuzz:
    name: Robustness tests (long run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      # A different seed every run widens coverage over time; the seed is
      # printed first, so a failure can be reproduced locally with
      # THREADHAUL_FUZZ_SEED=<seed>.
      - name: Fuzz parsers and the secure channel
        shell: pwsh
        env:
          THREADHAUL_FUZZ_ITERATIONS: '50000'
          THREADHAUL_FUZZ_SEED: ${{ github.run_number }}
        run: build\tests\RobustnessTests.exe

  lint:
    name: Lint scripts and dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell scripts parse cleanly
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Dashboard JavaScript syntax
        run: node --check web/dashboard/app.js

      - name: Log viewer compiles
        run: python -m py_compile tools/log_viewer.py

      - name: Config schema matches the example and rejects bad configs
        run: |
          python -m pip install --quiet jsonschema
          python tools/check_config_schema.py
