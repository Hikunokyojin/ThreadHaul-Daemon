name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: Build and test (CMake, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  linux:
    name: Build, test and package (Linux)
    # The oldest supported LTS, so the packages install on 22.04 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ cmake libssl-dev rpm

      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # As root the engine tests also cover cgroup CPU caps.
      - name: Engine tests as root
        run: sudo build/tests/LinuxEngineTests

      - name: Build packages
        run: cd build && cpack -G DEB && cpack -G RPM

      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./build/threadhaul_*.deb
          sudo threadhauld validate-config /etc/threadhaul/config.json
          sudo threadhauld --console --config /etc/threadhaul/config.json &
          sleep 3
          sudo threadhauld status | tee status.json
          grep -q '"ok":true' status.json
          sudo threadhauld stop
          sudo apt-get remove -y threadhaul
          sudo test -e /etc/threadhaul/config.json   # kept on removal (the folder is root-only)

      - name: Check the .rpm
        run: rpm -qpl build/threadhaul-*.rpm | grep -q /usr/sbin/threadhauld

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/threadhaul_*.deb
            build/threadhaul-*.rpm

  build-script:
    name: Build and test (build.cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and run unit tests
        shell: cmd
        run: build.cmd test

      - name: Build and validate the MSI
        shell: powershell
        run: |
          .\scripts\build-msi.ps1 -OutDir out\msi
          $msi = Get-ChildItem out\msi\*.msi | Select-Object -First 1
          dotnet tool run wix -- msi validate $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSI validation failed ($LASTEXITCODE)" }

  analyze:
    name: Static analysis (MSVC /analyze)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # THREADHAUL_ANALYZE adds /analyze /WX: any finding fails the build.
      - name: Configure with /analyze
        run: cmake --preset windows-msvc -DTHREADHAUL_ANALYZE=ON

      - name: Build
        run: cmake --build --preset release

  fuzz:
    name: Robustness tests (long run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.cmd

      # A different seed every run widens coverage over time; the seed is
      # printed first, so a failure can be reproduced locally with
      # THREADHAUL_FUZZ_SEED=<seed>.
      - name: Fuzz parsers and the secure channel
        shell: pwsh
        env:
          THREADHAUL_FUZZ_ITERATIONS: '50000'
          THREADHAUL_FUZZ_SEED: ${{ github.run_number }}
        run: build\tests\RobustnessTests.exe

  lint:
    name: Lint scripts and dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell scripts parse cleanly
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Dashboard JavaScript syntax
        run: node --check web/dashboard/app.js

      - name: Log viewer compiles
        run: python -m py_compile tools/log_viewer.py

      - name: Config schema matches the example and rejects bad configs
        run: |
          python -m pip install --quiet jsonschema
          python tools/check_config_schema.py

      - name: OpenAPI description is valid
        run: |
          python -m pip install --quiet openapi-spec-validator
          python -c "from openapi_spec_validator import validate; from openapi_spec_validator.readers import read_from_filename; d, _ = read_from_filename('web/dashboard/openapi.json'); validate(d); print('OpenAPI spec valid')"
